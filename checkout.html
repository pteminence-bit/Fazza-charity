<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Aura of Hope</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --surface-color: #141414;
            --surface-border: #262626;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa820a;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 11, 11, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        nav a:hover, nav a.active {
            color: var(--gold);
        }

        main {
            padding-top: 80px;
            min-height: calc(100vh - 140px);
        }

        .page {
            padding: 4rem 5%;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            font-weight: 600;
            padding: 0.9rem 2.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            text-align: center;
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 2rem;
            transition: var(--transition);
            overflow: hidden;
        }

        .summary-box {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--surface-border);
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
            font-weight: bold;
            color: var(--gold);
        }

        footer {
            background-color: var(--surface-color);
            border-top: 1px solid var(--surface-border);
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">AURA OF HOPE</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="donate.html" class="active">Donate</a>
            <a href="credits.html">Credits</a>
        </nav>
    </header>

    <main>
        <section class="page">
            <div style="max-width: 600px; margin: 0 auto;">
                <h2 style="color: var(--gold); margin-bottom: 0.5rem; text-align: center;">Finalize Contribution</h2>
                <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Please review details of your contribution.</p>

                <div class="summary-box">
                    <div class="summary-row">
                        <span>Selected Amount:</span>
                        <span id="summary-amount">$100.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Payment Method:</span>
                        <span id="summary-method">Gift Card</span>
                    </div>
                    <div class="summary-row">
                        <span>Total Payable:</span>
                        <span id="summary-total">$100.00</span>
                    </div>
                </div>

                <div class="card">
                    <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                        <button id="pay-action-btn" class="btn" style="width: 100%;">Proceed to Payment</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Aura of Hope Foundation. Dedicated to global child preservation.</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = parseFloat(urlParams.get('amount') || '100');
        const currency = urlParams.get('currency') || 'USD';
        const symbol = urlParams.get('symbol') || '$';
        const method = urlParams.get('method') || 'Gift Card';

        const formattedText = `${symbol}${amount.toFixed(2)} ${currency}`;
        document.getElementById('summary-amount').innerText = formattedText;
        document.getElementById('summary-method').innerText = method;
        document.getElementById('summary-total').innerText = formattedText;

        const payBtn = document.getElementById('pay-action-btn');
        payBtn.innerText = `Complete ${symbol}${amount} Payment via ${method}`;

        payBtn.onclick = function() {
            if (method === 'Gift Card') {
                window.location.href = `pay-giftcard.html?amount=${amount}`;
            } else if (method === 'Crypto') {
                window.location.href = `pay-crypto.html?amount=${amount}`;
            }
        };
    </script>
</body>
</html>
